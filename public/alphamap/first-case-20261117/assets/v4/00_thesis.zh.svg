<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-label="相同投运规模、不同HBM采购"><rect width="1440" height="800" fill="#f6f3eb"/><g font-family="Noto Sans CJK SC,DejaVu Sans,Arial,sans-serif"><text x="64" y="43" font-size="18" fill="#64716a" font-weight="700" text-anchor="start">LUNARTULIP RESEARCH  /  05</text><text x="1376" y="43" font-size="18" fill="#64716a" font-weight="400" text-anchor="end">2028 · 条件测算</text><text x="64" y="112" font-size="42" fill="#20332d" font-weight="700" text-anchor="start">同样的投运规模，采购量相差约2.4 EB</text><text x="64" y="161" font-size="25" fill="#64716a" font-weight="400" text-anchor="start">采购窗口改变了接货时间，也改变了库存融资需求</text><text x="64" y="235" font-size="24" fill="#64716a" font-weight="400" text-anchor="start">提前采购窗口</text><text x="335" y="235" font-size="24" fill="#64716a" font-weight="400" text-anchor="start">当年设备内嵌HBM · EB</text><text x="1228" y="212" font-size="23" fill="#64716a" font-weight="400" text-anchor="middle">年末已投运</text><text x="1228" y="244" font-size="23" fill="#64716a" font-weight="400" text-anchor="middle">AI系统IT容量</text><line x1="335" y1="275" x2="335" y2="522" stroke="#d9dbd1" stroke-width="1"/><text x="335" y="554" font-size="20" fill="#64716a" font-weight="400" text-anchor="middle">0</text><line x1="500" y1="275" x2="500" y2="522" stroke="#d9dbd1" stroke-width="1"/><text x="500" y="554" font-size="20" fill="#64716a" font-weight="400" text-anchor="middle">2</text><line x1="665" y1="275" x2="665" y2="522" stroke="#d9dbd1" stroke-width="1"/><text x="665" y="554" font-size="20" fill="#64716a" font-weight="400" text-anchor="middle">4</text><line x1="830" y1="275" x2="830" y2="522" stroke="#d9dbd1" stroke-width="1"/><text x="830" y="554" font-size="20" fill="#64716a" font-weight="400" text-anchor="middle">6</text><line x1="995" y1="275" x2="995" y2="522" stroke="#d9dbd1" stroke-width="1"/><text x="995" y="554" font-size="20" fill="#64716a" font-weight="400" text-anchor="middle">8</text><text x="64" y="338" font-size="32" fill="#20332d" font-weight="700" text-anchor="start">一季</text><rect x="335" y="291" width="408.9942645891525" height="72" rx="0" fill="#315f4e"/><text x="760.9942645891525" y="340" font-size="38" fill="#315f4e" font-weight="700" text-anchor="start">4.96</text><rect x="1118" y="284" width="220" height="86" rx="7" fill="#e6ebe1"/><text x="1228" y="339" font-size="32" fill="#20332d" font-weight="700" text-anchor="middle">99.7 GW</text><text x="64" y="475" font-size="32" fill="#20332d" font-weight="700" text-anchor="start">一年</text><rect x="335" y="428" width="603.1636687295203" height="72" rx="0" fill="#a76e32"/><text x="955.1636687295203" y="477" font-size="38" fill="#a76e32" font-weight="700" text-anchor="start">7.31</text><rect x="1118" y="421" width="220" height="86" rx="7" fill="#e6ebe1"/><text x="1228" y="476" font-size="32" fill="#20332d" font-weight="700" text-anchor="middle">99.7 GW</text><rect x="64" y="595" width="1312" height="88" rx="8" fill="#e4eadd"/><text x="90" y="650" font-size="42" fill="#315f4e" font-weight="700" text-anchor="start">+2.35 EB</text><text x="391" y="633" font-size="23" fill="#20332d" font-weight="700" text-anchor="start">年度采购差额</text><text x="391" y="666" font-size="22" fill="#64716a" font-weight="400" text-anchor="start">更多设备提前接货，资金占用增加</text><text x="64" y="727" font-size="20" fill="#64716a" font-weight="400" text-anchor="start">条件：设施IT年增25%、中值功率、相同开仓库存、一季投运延迟。</text><text x="64" y="765" font-size="18" fill="#64716a" font-weight="400" text-anchor="start">来源：LunarTulip Research模型4.1。覆盖设备内嵌HBM；年度流量不等于期末库存，未赋予情景概率。</text></g></svg>