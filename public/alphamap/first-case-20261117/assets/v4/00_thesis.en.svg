 y1="275" x2="995" y2="522" stroke="#d9dbd1" stroke-width="1"/><text x="995" y="554" font-size="20" fill="#64716a" font-weight="400" text-anchor="middle">8</text><text x="64" y="338" font-size="32" fill="#20332d" font-weight="700" text-anchor="start">1 quarter</text><rect x="335" y="291" width="408.9942645891525" height="72" rx="0" fill="#315f4e"/><text x="760.9942645891525" y="340" font-size="38" fill="#315f4e" font-weight="700" text-anchor="start">4.96</text><rect x="1118" y="284" width="220" height="86" rx="7" fill="#e6ebe1"/><text x="1228" y="339" font-size="32" fill="#20332d" font-weight="700" text-anchor="middle">99.7 GW</text><text x="64" y="475" font-size="32" fill="#20332d" font-weight="700" text-anchor="start">1 year</text><rect x="335" y="428" width="603.1636687295203" height="72" rx="0" fill="#a76e32"/><text x="955.1636687295203" y="477" font-size="38" fill="#a76e32" font-weight="700" text-anchor="start">7.31</text><rect x="1118" y="421" width="220" height="86" rx="7" fill="#e6ebe1"/><text x="1228" y="476" font-size="32" fill="#20332d" font-weight="700" text-anchor="middle">99.7 GW</text><rect x="64" y="595" width="1312" height="88" rx="8" fill="#e4eadd"/><text x="90" y="650" font-size="42" fill="#315f4e" font-weight="700" text-anchor="start">+2.35 EB</text><text x="391" y="633" font-size="23" fill="#20332d" font-weight="700" text-anchor="start">Annual procurement difference</text><text x="391" y="666" font-size="22" fill="#64716a" font-weight="400" text-anchor="start">More equipment taken early; more capital tied up</text><text x="64" y="727" font-size="20" fill="#64716a" font-weight="400" text-anchor="start">Held constant: 25% facility-IT growth, mid power, opening inventory and one-quarter physical lag.</text><text x="64" y="765" font-size="18" fill="#64716a" font-weight="400" text-anchor="start">Source: LunarTulip Research model 4.1. Covered-device HBM; annual flows differ from closing stocks. No scenario probabilities.</text></g></svg>